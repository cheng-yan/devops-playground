apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "playground-api.labels" . | nindent 4 }}
  {{- with .Values.workloadIdentity.clientId }}
  annotations:
    azure.workload.identity/client-id: {{ . | quote }}
  {{- end }}
automountServiceAccountToken: false
